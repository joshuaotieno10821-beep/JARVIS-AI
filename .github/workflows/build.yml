YAML

name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS_AI_Android_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract JARVIS project 
        run: |
          mkdir android-project
          unzip -q JARVIS_AI_Android_Project.zip -d android-project

      - name: Build APK
        run: gradle -p android-project assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
